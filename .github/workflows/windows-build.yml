
name: Build NOVA IPTV for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build NOVA IPTV
    runs-on: windows-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare Windows
        working-directory: nova_iptv_windows
        run: flutter create --platforms=windows --project-name=nova_iptv .

      - name: Remove Default Flutter Test
        working-directory: nova_iptv_windows
        shell: pwsh
        run: |
          if (Test-Path "test/widget_test.dart") {
            Remove-Item "test/widget_test.dart" -Force
          }

      - name: Install Dependencies
        working-directory: nova_iptv_windows
        run: flutter pub get

      - name: Analyze Project
        working-directory: nova_iptv_windows
        run: flutter analyze

      - name: Build NOVA IPTV
        working-directory: nova_iptv_windows
        run: flutter build windows --release

      - name: Upload NOVA IPTV
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-IPTV-Windows
          path: nova_iptv_windows/build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14
